workflows:
  android-workflow:
    name: WhatsAlert Android
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          cd WhatsAlert-GitHub
          gradle assembleDebug

    artifacts:
      - WhatsAlert-GitHub/app/build/outputs/apk/debug/*.apk
